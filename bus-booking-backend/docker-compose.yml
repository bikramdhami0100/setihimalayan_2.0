version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: bus_booking_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword123}
      MYSQL_DATABASE: ${DB_NAME:-bus_booking_system}
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app_password123}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build: .
    container_name: bus_booking_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=mysql
      - DB_USER=${DB_USER:-app_user}
      - DB_PASSWORD=${DB_PASSWORD:-app_password123}
      - DB_NAME=${DB_NAME:-bus_booking_system}
      - DB_PORT=3306
      - JWT_SECRET=${JWT_SECRET:-change_this_jwt_secret}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change_this_refresh_secret}
      - JWT_EXPIRES_IN=96h
      - JWT_REFRESH_EXPIRES_IN=7d
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_FROM=noreply@busbooking.com
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8081}
      - SEAT_LOCK_MINUTES=5
      - ESEWA_MERCHANT_CODE=${ESEWA_MERCHANT_CODE:-EPAYTEST}
      - ESEWA_SECRET_KEY=${ESEWA_SECRET_KEY:-8gBm/:&EnhH.1/q}
      - ESEWA_PAYMENT_URL=https://rc-epay.esewa.com.np/api/epay/main/v2/form
      - ESEWA_VERIFICATION_URL=https://rc-epay.esewa.com.np/api/epay/transaction/status/
      - BACKEND_URL=${BACKEND_URL:-http://localhost:5000}
      - ESEWA_SUCCESS_URL=${BACKEND_URL:-http://localhost:5000}/api/payments/success
      - ESEWA_FAILURE_URL=${BACKEND_URL:-http://localhost:5000}/api/payments/failure
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - app-network

volumes:
  mysql_data:
  backend_uploads:

networks:
  app-network:
    driver: bridge
